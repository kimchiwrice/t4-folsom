        }

        .tab.active {

        // Smart image lookup - handles ★ prefixes, "w/ Sea Salt", "/Smoothie" variants, etc.
        function getItemImage(itemName) {
            // Strip ★ prefix
            let clean = itemName.replace(/^★/, '').trim();

            // Direct match
            if (imageMap[clean]) return imageMap[clean];

            // Try without "/Smoothie" or "/ Taro Coconut" suffix
            let base = clean.split('/')[0].trim();
            if (imageMap[base]) return imageMap[base];

            // Try without "w/ Sea Salt"
            let noSeasalt = clean.replace(/\s*w\/\s*Sea Salt/i, '').trim();
            if (imageMap[noSeasalt]) return imageMap[noSeasalt];

            // Try stripping parenthetical suffixes like "(4pcs)", "(6pcs)", "(2 pcs)"
            let noParens = clean.replace(/\s*\(.*?\)\s*$/, '').trim();
            if (imageMap[noParens]) return imageMap[noParens];

            // Try replacing & with "and"
            let ampFixed = noParens.replace(/&/g, 'and');
            if (imageMap[ampFixed]) return imageMap[ampFixed];

            // Try partial match on first two words
            let words = clean.toLowerCase().split(/\s+/);
            for (const [key, val] of Object.entries(imageMap)) {
                let keyWords = key.toLowerCase().split(/\s+/);
                if (words[0] === keyWords[0] && words.length > 1 && words[1] === keyWords[1]) {
                    return val;
                }
            }

            return null;
        }

        // ==================== STATE ====================
        let currentCategory = 'all';

        // ==================== STORE HOURS ====================
        function updateStoreStatus() {
            const now = new Date();
            const day = now.getDay();
            const hours = now.getHours();

            let isOpen = false;
            let openTime = '11:00 AM';
            let closeTime = '9:00 PM';

            if (day === 0 || day >= 1 && day <= 4) { // Sun-Thu
                isOpen = hours >= 11 && hours < 21;
                closeTime = '9:00 PM';
            } else if (day === 5 || day === 6) { // Fri-Sat
                isOpen = hours >= 11 && hours < 22;
                closeTime = '10:00 PM';
            }

            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (isOpen) {
                dot.classList.add('open');
                text.textContent = 'Open';
            } else {
                dot.classList.remove('open');
                text.textContent = 'Closed';
            }
        }

        // ==================== RENDER ====================
        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';

            const categories = ['all', 'Milk Tea', 'Caffeine Free', 'Coffee Lattes', 'Sea Salted', 'Smoothies', 'Taiwan Classic', 'Snacks', 'Ice Cream'];

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `tab ${cat === currentCategory ? 'active' : ''}`;
                btn.textContent = cat === 'all' ? 'All' : cat;
                btn.onclick = () => switchCategory(cat);
                tabsContainer.appendChild(btn);
            });
        }

        function renderMenu() {
            const menuContent = document.getElementById('menuContent');
            menuContent.innerHTML = '';

            const items = menuData[currentCategory];
            const grid = document.createElement('div');
            grid.className = 'menu-grid';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-card';

                let priceDisplay = item.price.toFixed(2);
                const bestsellerBadge = item.bestseller ? '<span class="best-seller">★</span>' : '';
                const imgSrc = getItemImage(item.name);
                const imageHtml = imgSrc
                    ? `<img class="menu-card-image" src="${imgSrc}" alt="${item.name}" loading="lazy" onerror="this.style.display='none'">`
                    : `<div class="menu-card-image" style="background: linear-gradient(135deg, var(--dark-2), rgba(42,191,191,0.1)); display:flex; align-items:center; justify-content:center; font-size:2.5rem; opacity:0.3;">🍵</div>`;

                card.innerHTML = `
                    ${imageHtml}
                    <div class="menu-card-body">
                        <div class="menu-card-header">
                            <div class="menu-card-title">${item.name}</div>
                            ${bestsellerBadge}
                        </div>
                        <div class="menu-card-description">
                            ${item.isNew ? '<span style="color: var(--accent); font-weight: 500;">New</span>' : ''}
                        </div>
                        <div class="menu-card-price">$${priceDisplay}</div>
                    </div>
                `;

                grid.appendChild(card);
            });

            menuContent.appendChild(grid);
        }

        function switchCategory(category) {
            currentCategory = category;
            renderCategoryTabs();
            renderMenu();
        }

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', () => {
            updateStoreStatus();
            renderCategoryTabs();
            renderMenu();
            setInterval(updateStoreStatus, 60000);
        });
    </script>
